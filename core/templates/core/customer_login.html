{% extends "base.html" %}

{% block content %}
<div class="container py-5" style="max-width: 520px;">
  <h1 class="mb-4 text-center">会員ログイン</h1>
  <p class="text-center text-muted mb-4">予約確認や会員向け機能をご利用いただけます。</p>

  <form method="post" class="card p-4 shadow-sm">
    {% csrf_token %}

    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-danger">{{ message }}</div>
      {% endfor %}
    {% endif %}

    {% if form.errors %}
      <div class="alert alert-danger">
        ユーザー名またはパスワードが正しくありません。
      </div>
    {% endif %}

    <div class="mb-3">
      <label for="{{ form.username.id_for_label }}" class="form-label">ユーザー名</label>
      {{ form.username }}
    </div>

    <div class="mb-3">
      <label for="{{ form.password.id_for_label }}" class="form-label">パスワード</label>
      {{ form.password }}
    </div>

    <button type="submit" class="btn btn-dark w-100">ログイン</button>
  </form>
</div>
{% endblock %}
